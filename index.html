    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Default Dark Theme Variables */
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --bg-gradient-1: rgba(59, 130, 246, 0.15);
            --bg-gradient-2: rgba(16, 185, 129, 0.1);
        }

        /* Light Theme Variables */
        body.light-theme {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.8);
            --card-border: rgba(0, 0, 0, 0.1);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-glow: rgba(37, 99, 235, 0.3);
            --bg-gradient-1: rgba(37, 99, 235, 0.1);
            --bg-gradient-2: rgba(16, 185, 129, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
            background-image: 
                radial-gradient(circle at 15% 50%, var(--bg-gradient-1) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, var(--bg-gradient-2) 0%, transparent 50%);
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 24px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .theme-toggle * {
            pointer-events: none;
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }

        .theme-toggle:active {
            transform: scale(0.96);
        }

        header {
            text-align: center;
            padding: 80px 20px 40px;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--card-border);
            box-shadow: 0 0 30px var(--accent-glow);
            margin-bottom: 24px;
            transition: box-shadow 0.3s ease;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            margin-bottom: 12px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bio {
            color: var(--text-secondary);
            font-size: 1.15rem;
            line-height: 1.7;
            margin-bottom: 24px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 12px;
        }

        .bio-separator {
            color: var(--accent);
            opacity: 0.75;
            font-weight: 600;
        }

        /* Social Links */
        .social-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .social-btn i {
            font-size: 1.2rem;
        }

        /* Brand Colors for Hover */
        .social-btn.linkedin:hover { color: #0a66c2; border-color: #0a66c2; }
        .social-btn.github:hover { color: #f97316; border-color: #f97316; }
        .social-btn.hackerrank:hover { color: #2ec866; border-color: #2ec866; }
        .social-btn.youtube:hover { color: #ff0000; border-color: #ff0000; }

        /* Profile Meta Pills & Visitor Counter */
        .profile-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .meta-pill:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
            color: var(--text-primary);
        }

        .visitor-pill {
            gap: 10px;
            cursor: default;
        }

        .visitor-label {
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .visitor-badge-img {
            height: 20px;
            vertical-align: middle;
            border-radius: 4px;
            transition: transform 0.2s ease;
        }

        .visitor-badge-img:hover {
            transform: scale(1.04);
        }

        /* Pulse live indicator */
        .pulse-indicator {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 8px;
            height: 8px;
            margin-right: 2px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
        }

        .pulse-ring {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: rgba(16, 185, 129, 0.45);
            animation: pulseGlow 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        /* Footer styling */
        footer {
            border-top: 1px solid var(--card-border);
            background: var(--card-bg);
            padding: 24px 20px;
            margin-top: 40px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .footer-links {
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .footer-dot {
            opacity: 0.4;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        h2.section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 40px;
            text-align: center;
            color: var(--text-primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 28px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
            border-color: var(--accent);
        }

        .repo-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .repo-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .tag {
            background: rgba(148, 163, 184, 0.1);
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--card-border);
            padding-top: 16px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            gap: 12px;
            flex-wrap: wrap;
        }

        .card-actions {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: rgba(148, 163, 184, 0.12);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: var(--accent);
            color: #fff;
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .secondary-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .secondary-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .primary-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.88rem;
            transition: background 0.2s ease, transform 0.2s ease;
            border: none;
        }

        .primary-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .loader {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            grid-column: 1 / -1;
            padding: 40px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeIn 0.5s ease backwards;
        }

        /* Responsive Media Queries */
        @media (max-width: 768px) {
            header { padding: 50px 16px 24px; }
            main { padding: 30px 16px 60px; }
            .grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }
            .card {
                padding: 22px;
            }
            .social-links { gap: 10px; }
            .social-btn { padding: 8px 14px; font-size: 0.88rem; }
            .footer-content { justify-content: center; text-align: center; }
        }

        @media (max-width: 520px) {
            .theme-toggle {
                top: 14px;
                right: 14px;
                width: 42px;
                height: 42px;
                padding: 0;
                border-radius: 50%;
                justify-content: center;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            }
            .theme-toggle #themeText {
                display: none;
            }
            .theme-toggle i {
                font-size: 1.15rem;
                margin: 0;
            }
            h1 {
                font-size: 2.2rem;
            }
            .bio {
                font-size: 1rem;
                line-height: 1.5;
            }
            .social-links {
                gap: 8px;
            }
            .social-btn {
                padding: 7px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

                if (this.src && this.src.indexOf('badges.pufler.dev') === -1) {
                    this.src = 'https://badges.pufler.dev/visits/sgr-m/sgr-m.github.io?style=flat&color=3b82f6&label=Visitors&labelColor=1e293b';
                } else {
                    this.style.display = 'none';
                }
            };
        }

        // --- Safe Storage Helpers ---
        function safeGetStorage(key) {
            try {
                return localStorage.getItem(key);
            } catch (e) {
                return null;
            }
        }

        function safeSetStorage(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (e) {
                // Ignore storage errors in restricted private browsing
            }
        }

        // --- Theme Toggle Logic ---
        function updateThemeUI(isLight) {
            if (!themeIcon || !themeText) return;
            if (isLight) {
                themeIcon.className = 'fa-solid fa-moon';
                themeText.textContent = 'Dark Mode';
                if (visitorBadge && visitorBadge.style.display !== 'none') {
                    visitorBadge.src = 'https://visitor-badge.laobi.icu/badge?page_id=sgr-m.github.io&left_color=%23475569&right_color=%232563eb&left_text=Visitors';
                }
            } else {
                themeIcon.className = 'fa-solid fa-sun';
                themeText.textContent = 'Light Mode';
                if (visitorBadge && visitorBadge.style.display !== 'none') {
                    visitorBadge.src = 'https://visitor-badge.laobi.icu/badge?page_id=sgr-m.github.io&left_color=%231e293b&right_color=%233b82f6&left_text=Visitors';
                }
            }
        }

        // Check local storage or system preference
        const savedTheme = safeGetStorage('portfolio-theme');
        const systemPrefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        const initialLight = savedTheme === 'light' || (!savedTheme && systemPrefersLight);

        if (initialLight) {
            document.body.classList.add('light-theme');
            updateThemeUI(true);
        } else {
            updateThemeUI(false);
        }

        if (themeBtn) {
            themeBtn.addEventListener('click', () => {
                const isLight = document.body.classList.toggle('light-theme');
                safeSetStorage('portfolio-theme', isLight ? 'light' : 'dark');
                updateThemeUI(isLight);
            });
        }

        // Helper to prevent XSS
        const escapeHTML = (str) => {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        };

        function renderRepos(repos) {
            if (!grid) return;
            if (!Array.isArray(repos) || repos.length === 0) {
                grid.innerHTML = '<div class="loader">No projects found.</div>';
                return;
            }

            grid.innerHTML = ''; 

            repos.forEach((repo, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${Math.min(index * 0.08, 0.8)}s`;

                let liveLink = '';
                let targetUrl = repo.html_url;

                if (repo.has_pages) {
                    if (repo.name.includes("DATA-ANALYTICS") || repo.name.includes("DASHBOARD")) {
                        targetUrl = `https://${GITHUB_USERNAME}.github.io/${repo.name}/dashboard/`;
                    } else {
                        targetUrl = `https://${GITHUB_USERNAME}.github.io/${repo.name}/`;
                    }
                }

                const updatedDate = repo.updated_at
                    ? new Date(repo.updated_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' })
                    : '';

                const safeName = escapeHTML(repo.name.replace(/-/g, ' '));
                const safeDesc = escapeHTML(repo.description) || 'No description provided.';
                const safeLang = escapeHTML(repo.language);
                
                let topicsHtml = '';
                if (Array.isArray(repo.topics)) {
                    topicsHtml = repo.topics.map(t => `<span class="tag">${escapeHTML(t)}</span>`).join('');
                }

                card.innerHTML = `
                    <h3 class="repo-name">${safeName}</h3>
                    <p class="repo-desc">${safeDesc}</p>
                    
                    <div class="tags">
                        ${safeLang ? `<span class="tag"><i class="fa-solid fa-circle" style="font-size:8px; margin-right:4px;" aria-hidden="true"></i>${safeLang}</span>` : ''}
                        ${topicsHtml}
                    </div>

                    <div class="card-footer">
                        <span><i class="fa-regular fa-clock" aria-hidden="true"></i> Updated: ${updatedDate}</span>
                        <div class="card-actions">
                            ${repo.has_pages ? `<a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="primary-btn"><i class="fa-solid fa-chart-line" aria-hidden="true"></i> View Site</a>` : ''}
                            <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer" class="${repo.has_pages ? 'icon-btn' : 'secondary-link'}" title="View GitHub Repository" aria-label="View code on GitHub">
                                <i class="fa-brands fa-github" aria-hidden="true"></i> ${repo.has_pages ? '' : 'View Code &rarr;'}
                            </a>
                        </div>
                    </div>
                `;

                // Interactive card click handler (safe from mobile pop-up blockers)
                card.style.cursor = 'pointer';
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('a') && !e.target.closest('button')) {
                        const destination = repo.has_pages ? targetUrl : repo.html_url;
                        window.open(destination, '_blank', 'noopener,noreferrer');
                    }
                });

                grid.appendChild(card);
            });
        }

        async function fetchRepos() {
            const cacheKey = 'github-repos-cache';
            const cacheTimeKey = 'github-repos-cache-time';
            
            // 1. Try to load from session storage cache
            let hasLoadedFromCache = false;
            try {
                const cacheTime = sessionStorage.getItem(cacheTimeKey);
                if (cacheTime && (Date.now() - parseInt(cacheTime, 10)) < 3600000) {
                    const cachedData = sessionStorage.getItem(cacheKey);
                    if (cachedData) {
                        const parsed = JSON.parse(cachedData);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            renderRepos(parsed);
                            hasLoadedFromCache = true;
                        }
                    }
                }
            } catch (e) {
                console.warn('Session storage cache read failed:', e);
            }

            // 2. If not loaded from cache, immediately render static repos to prevent stuck loading state
            if (!hasLoadedFromCache) {
                renderRepos(STATIC_REPOS);
            }

            // 3. Background fetch fresh data from GitHub API with a 6-second timeout
            const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
            const timeoutId = controller ? setTimeout(() => controller.abort(), 6000) : null;

            try {
                const fetchOptions = {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                };
                if (controller) {
                    fetchOptions.signal = controller.signal;
                }

                const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=100`, fetchOptions);
                if (timeoutId) clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error(`GitHub API returned status ${response.status}`);
                }

                let repos = await response.json();
                if (Array.isArray(repos)) {
                    repos = repos.filter(repo => repo.name !== `${GITHUB_USERNAME}.github.io`);
                    if (repos.length > 0) {
                        renderRepos(repos);
                        try {
                            sessionStorage.setItem(cacheKey, JSON.stringify(repos));
                            sessionStorage.setItem(cacheTimeKey, Date.now().toString());
                        } catch (e) {
                            // Storage may be quota-restricted, ignore safely
                        }
                    }
                }
            } catch (error) {
                if (timeoutId) clearTimeout(timeoutId);
                console.warn('GitHub API fetch failed or rate-limited; displaying cached/curated projects:', error.message);
                // Already rendered STATIC_REPOS or cache, so the user never sees an error or stuck loader
            }
        }

        fetchRepos();
    </script>
