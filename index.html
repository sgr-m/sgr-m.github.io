<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sagar Maindola | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
        }

        header {
            text-align: center;
            padding: 80px 20px 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--card-border);
            box-shadow: 0 0 30px var(--accent-glow);
            margin-bottom: 24px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bio {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .location {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        h2.section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            margin-bottom: 32px;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .repo-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            color: #60a5fa;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .repo-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--card-border);
            padding-top: 16px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .primary-btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .primary-btn:hover {
            background: #2563eb;
        }

        .loader {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            grid-column: 1 / -1;
            padding: 40px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeIn 0.5s ease backwards;
        }
    </style>
</head>
<body>

    <header>
        <img src="https://avatars.githubusercontent.com/u/58383347?v=4" alt="Sagar Maindola" class="avatar">
        <h1>Sagar Maindola</h1>
        <p class="bio">PGT Computer Science | Passionate about teaching Python, C++, DBMS & Data Science | Sharing projects and practical coding examples for students and learners</p>
        <div class="location">
            📍 Uttarakhand, India
        </div>
    </header>

    <main>
        <h2 class="section-title">Research & Projects</h2>
        <div class="grid" id="repos-grid">
            <div class="loader">Loading projects from GitHub...</div>
        </div>
    </main>

    <script>
        const GITHUB_USERNAME = 'sgr-m';
        const grid = document.getElementById('repos-grid');

        async function fetchRepos() {
            try {
                // Fetch public repositories, sorted by most recently updated
                const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=100`);
                if (!response.ok) throw new Error('Failed to fetch repositories');
                
                let repos = await response.json();
                
                // Filter out the portfolio repo itself (sgr-m.github.io)
                repos = repos.filter(repo => repo.name !== `${GITHUB_USERNAME}.github.io`);

                grid.innerHTML = ''; // Clear loader

                if(repos.length === 0) {
                    grid.innerHTML = '<div class="loader">No projects found.</div>';
                    return;
                }

                repos.forEach((repo, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.animationDelay = `${index * 0.1}s`;

                    // If the repo has GitHub Pages enabled, we link to the live dashboard
                    // Specifically adding /dashboard/ for your standard structure. 
                    // You can customize this logic if some repos don't have a /dashboard/ subfolder.
                    let liveLink = '';
                    let actionText = 'View Repository';
                    let targetUrl = repo.html_url;

                    if (repo.has_pages) {
                        actionText = 'View Live Dashboard';
                        targetUrl = `https://${GITHUB_USERNAME}.github.io/${repo.name}/dashboard/`;
                        liveLink = `<a href="${targetUrl}" target="_blank" class="primary-btn">View Live Dashboard</a>`;
                    } else if (repo.name.includes("DATA-ANALYTICS") || repo.name.includes("DASHBOARD")) {
                        // Fallback prediction if pages is not fully synced yet in API
                        actionText = 'View Live Dashboard';
                        targetUrl = `https://${GITHUB_USERNAME}.github.io/${repo.name}/dashboard/`;
                        liveLink = `<a href="${targetUrl}" target="_blank" class="primary-btn">View Live Dashboard</a>`;
                    } else {
                        liveLink = `<a href="${targetUrl}" target="_blank" style="color: var(--accent); text-decoration: none;">View Code &rarr;</a>`;
                    }

                    // Format Date
                    const updatedDate = new Date(repo.updated_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });

                    card.innerHTML = `
                        <h3 class="repo-name">${repo.name.replace(/-/g, ' ')}</h3>
                        <p class="repo-desc">${repo.description || 'No description provided.'}</p>
                        
                        <div class="tags">
                            ${repo.language ? `<span class="tag">${repo.language}</span>` : ''}
                            ${repo.topics ? repo.topics.map(t => `<span class="tag">${t}</span>`).join('') : ''}
                        </div>

                        <div class="card-footer">
                            <span>🕒 Updated: ${updatedDate}</span>
                            ${liveLink}
                        </div>
                    `;

                    // Make the whole card clickable
                    card.style.cursor = 'pointer';
                    card.addEventListener('click', (e) => {
                        if(e.target.tagName !== 'A') {
                            window.open(targetUrl, '_blank');
                        }
                    });

                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = '<div class="loader" style="color: #ef4444;">Failed to load projects. Please try again later.</div>';
            }
        }

        // Initialize
        fetchRepos();
    </script>
</body>
</html>
